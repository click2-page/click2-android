name: Release

# Tag vX.Y.Z -> signed upload to Maven Central + GitHub Release.
# Before tagging: set `version` in click2/build.gradle.kts and move the CHANGELOG entries under the new version.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the version matches the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$V\"" click2/build.gradle.kts || { echo "click2/build.gradle.kts version is not $V"; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "CHANGELOG.md has no $V section"; exit 1; }
      - run: ./gradlew :click2:testDebugUnitTest
      - name: Publish to Maven Central
        run: ./gradlew :click2:assembleRelease :click2:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Release notes from the changelog
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^(## )?\[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: click2/build/outputs/aar/click2-release.aar
